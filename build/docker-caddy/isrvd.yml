schema:
  version: 3

cluster:
  mode: server
  centerUrl: ""
  nodeToken: ""

server:
  listenAddr: :8080
  rootDirectory: /data/
  maxUploadSize: 104857600
  allowedOrigins: []
  jwtSecret: your-jwt-secret
  jwtExpiration: 86400
  openapi: false
  debug: false

tha:
  enabled: false
  headerName: X-Username
  trustedCIDRs: [127.0.0.1/32]

oidc:
  enabled: false
  usernameClaim: sub
  scopes: [openid, profile, email]
  loginLabel: ""

passkey:
  enabled: false
  rpName: "iSrvd"
  rpId: "localhost"
  rpOrigins:
    - "http://localhost:8080"
  timeout: 60000

copilot:
  # model: your-model
  # baseUrl: https://ai.example.com/v1
  # apiKey: your-api-key

notify:
  webhooks: []
  rules: []
  events:
    containerEnabled: false
    cronEnabled: false
    certificateEnabled: false
    restartThreshold: 3
    restartWindow: 300
    certificateDays: 14

apisix:
  # adminUrl: http://127.0.0.1:9180/apisix/admin
  # adminKey: your-admin-key

caddy:
  adminUrl: http://127.0.0.1:2019

docker:
  host: unix:///var/run/docker.sock
  containerRoot: container/
  registries: []

monitor:
  interval: 0

marketplace:
  url: https://apps.rehi.org

portmap:
  # 仅 center 模式使用：中控端口映射（端口转发），修改后需重启生效；与 Docker 容器端口映射无关
  # ports: 20000-20999  # 允许分配的监听端口范围（或单个端口）；留空则不启用端口转发
  # bind: 0.0.0.0       # 监听地址（IP）；容器内须设为 0.0.0.0，宿主机端口由 isrvd.sh update 按 ports 发布

links:
  - label: 工具箱
    url: https://api.rehi.org
    icon: fas fa-cloud-bolt

members:
  - username: admin
    password: admin
    homeDirectory: /
    founder: true
