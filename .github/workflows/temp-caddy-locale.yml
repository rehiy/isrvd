name: Temporary Caddy Locale Generation
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - run: npm ci
        working-directory: webview
      - name: Regenerate translations and show changes
        run: |
          node scripts/gen-zh-hant.mjs
          git diff -- server/i18n/lang_zh_hant_messages.go webview/src/locales/messages/zh-Hant.ts
          node scripts/gen-zh-hant.mjs --check
