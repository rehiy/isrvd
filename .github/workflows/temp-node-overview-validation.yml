name: Temporary Multi-node Overview Validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    name: Go compile and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
  webview:
    name: Webview lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: Existing style review
        run: python3 scripts/review-style.py
        continue-on-error: true
