name: iSrvd Quality Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go compile and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/check-go-locales.py --strict
      - run: python3 scripts/gen-zh-hant.py --check
      - name: Compile all packages
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Verify the embedded OpenAPI document
        run: |
          go run ./server/cmd/openapi-gen -o "$RUNNER_TEMP/openapi.json"
          cmp public/openapi/data.json "$RUNNER_TEMP/openapi.json"

  webview:
    name: Webview lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webview
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: webview/scripts/requirements.txt
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: python3 scripts/check-api-contract.py
      - run: python3 scripts/check-locales.py --strict
      - run: python3 scripts/gen-zh-hant.py --check
      - run: python3 scripts/review-style.py
      - run: npm run build

  scripts:
    name: Scripts and locale contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python script syntax
        run: python3 -c "import ast; from pathlib import Path; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for d in ('scripts', 'webview/scripts') for p in Path(d).glob('*.py')]"
      - name: Verify independent locale tool semantics
        run: python3 -B scripts/check-locale-contract.py
      - name: Check installation and container script syntax
        run: |
          sh -n build.sh
          bash -n develop.sh
          while IFS= read -r -d '' script; do
            case "$(head -n 1 "$script")" in
              *bash*) bash -n "$script" ;;
              *) sh -n "$script" ;;
            esac
          done < <(find build scripts -type f '(' -name '*.sh' -o -name run -o -name finish ')' -print0)
      - name: Validate website PHP entrypoints
        run: |
          php --version
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find build/home-page -type f -name '*.php' -print0)
      - run: git diff --check HEAD^ HEAD
        if: github.event_name == 'push'
      - run: git diff --check origin/${{ github.base_ref }}...HEAD
        if: github.event_name == 'pull_request'
