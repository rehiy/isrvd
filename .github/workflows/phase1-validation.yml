name: Temporary Phase1 Build Validation
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
  webview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - run: npm ci
        working-directory: webview
      - run: npm run lint
        working-directory: webview
      - run: npm run build
        working-directory: webview
